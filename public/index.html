<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="매일 오전 9시에 갱신되는 중앙일보 축구 기사 5선">
  <title>오늘의 축구 5선</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero__top">
        <div class="brand">
          <div class="brand__mark" aria-hidden="true">⚽</div>
          <div>
            <p class="eyebrow">DAILY FOOTBALL BRIEF</p>
            <h1>오늘의 축구 5선</h1>
          </div>
        </div>

        <button id="installButton" class="ghost-button is-hidden" type="button">
          앱 설치
        </button>
      </div>

      <p class="hero__description">
        중앙일보 축구 기사 중 최신 5건을 매일 오전 9시에 정리합니다.
      </p>

      <div class="status-panel" aria-live="polite">
        <div>
          <span class="status-panel__label">최종 갱신</span>
          <strong id="updatedAt">확인 중</strong>
        </div>
        <div>
          <span class="status-panel__label">오늘 기사</span>
          <strong id="todayCount">-</strong>
        </div>
        <div>
          <span class="status-panel__label">전체</span>
          <strong id="articleCount">-</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="기사 도구">
        <div>
          <p id="dateLabel" class="date-label">오늘의 기사</p>
          <p id="dataNotice" class="data-notice">데이터를 불러오고 있습니다.</p>
        </div>

        <div class="toolbar__actions">
          <button id="resetReadButton" class="text-button" type="button">
            읽음 초기화
          </button>
          <button id="refreshButton" class="primary-button" type="button">
            <span aria-hidden="true">↻</span>
            새로고침
          </button>
        </div>
      </section>

      <section id="messageBox" class="message-box is-hidden" role="status"></section>

      <section id="articleList" class="article-list" aria-label="축구 기사 목록">
        <article class="skeleton-card"></article>
        <article class="skeleton-card"></article>
        <article class="skeleton-card"></article>
      </section>
    </main>

    <footer>
      <p>
        기사 제목을 누르면 중앙일보 원문으로 이동합니다. 기사 본문과 이미지는 저장하지 않습니다.
      </p>
      <a href="https://www.joongang.co.kr/sports/soccer"
         target="_blank"
         rel="noopener noreferrer">
        중앙일보 축구 전체 보기
      </a>
    </footer>
  </div>

  <template id="articleTemplate">
    <article class="article-card">
      <a class="article-card__link" target="_blank" rel="noopener noreferrer">
        <div class="article-card__number" aria-hidden="true"></div>

        <div class="article-card__content">
          <div class="article-card__meta">
            <span class="article-card__badge"></span>
            <time class="article-card__time"></time>
          </div>

          <h2 class="article-card__title"></h2>
          <p class="article-card__summary"></p>

          <div class="article-card__bottom">
            <span class="article-card__source">중앙일보</span>
            <span class="article-card__open">원문 보기 →</span>
          </div>
        </div>
      </a>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
